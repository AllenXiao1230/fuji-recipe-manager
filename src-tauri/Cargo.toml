[package]
name = "fuji-recipe-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform Fujifilm recipe manager"

[lib]
name = "fuji_recipe_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
camera-core = { path = "../crates/camera-core" }
usb-transport = { path = "../crates/usb-transport" }
camera-fujifilm = { path = "../crates/camera-fujifilm" }
camera-xm5 = { path = "../crates/camera-xm5" }
ptp-core = { path = "../crates/ptp-core" }
raf-preview = { path = "../crates/raf-preview" }
